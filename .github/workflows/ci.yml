name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  build:
    name: Static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Check bundle size
        run: |
          SIZE=$(du -sb .output/public | cut -f1)
          BUDGET=3145728   # 3 MiB
          printf 'Bundle size: %s bytes\n' "$SIZE"
          printf 'Budget:      %s bytes (3 MiB)\n' "$BUDGET"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::Bundle size $SIZE bytes exceeds budget $BUDGET bytes"
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: static-output
          path: .output/public
          retention-days: 1

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: static-output
          path: .output/public
      - run: npx -y @lhci/cli@latest autorun --config=lighthouserc.json
